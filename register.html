<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/css.css">
  <title>Register - NRIIT</title>
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="index.html">NRIIT Learning</a></div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="trainers.html">Trainers</a>
      <a href="login.html">Login</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="main-container">
    <section class="content-card">
      <h2>Student Registration</h2>
      <p>Register now to begin your journey in full stack development, web design, mobile apps, or data science.</p>
      <form class="auth-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <label for="course">Select Course</label>
        <select id="course" name="course" required>
          <option value="">Choose a course</option>
          <option value="python">Python Full Stack</option>
          <option value="web">Web Development</option>
          <option value="flutter">Flutter Development</option>
          <option value="data">Data Science</option>
        </select>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <button type="submit">Register</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 NRIIT Learning Management. Start your professional learning experience today.</p>
  </footer>
</body>
</html>
