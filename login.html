<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/css.css">
  <title>Login - NRIIT</title>
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="index.html">NRIIT Learning</a></div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="trainers.html">Trainers</a>
      <a href="register.html">Register</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="main-container">
    <section class="content-card">
      <h2>Student Login</h2>
      <p>Access your courses, track progress, and continue learning with your NRIIT account.</p>
      <form class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="submit">Login</button>
      </form>
      <p class="small-text">Don't have an account? <a href="register.html">Register here</a></p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 NRIIT Learning Management. Secure login for students.</p>
  </footer>
</body>
</html>
