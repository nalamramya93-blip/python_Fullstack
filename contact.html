<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact NRIIT</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="courses.html">Courses</a>
            <a href="trainers.html">Trainers</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="contact.html">Contacts</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Get in touch</h2>
            <p>If you have questions about courses or registration, we are here to help.</p>
            <p><strong>Email:</strong> info@nriit.edu</p>
            <p><strong>Phone:</strong> +91 98765 43210</p>
            <p><strong>Location:</strong> Andhra Pradesh, India</p>
        </section>
        <section>
            <h2>Send a message</h2>
            <form>
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" placeholder="Your name" required><br>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" placeholder="you@example.com" required><br>
                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="4" placeholder="Your message"></textarea><br>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
</body>
</html>
